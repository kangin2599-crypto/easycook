<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Cook - AI 냉장고 맞춤 레시피</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
        }
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 2rem;
        }
        .header p {
            color: #666;
            margin-top: 5px;
        }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
            border-bottom: 2px solid #ffe3e3;
            padding-bottom: 8px;
        }
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }
        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .checkbox-label input {
            margin-right: 6px;
            accent-color: var(--primary-color);
        }
        .file-upload-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #fff0f0;
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            text-align: center;
            color: var(--primary-color);
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        .preview-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 15px;
            display: none;
        }
        .btn-submit {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        #result {
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .loading {
            text-align: center;
            color: #666;
            font-weight: bold;
        }
    </style>
    <script src="data.js"></script>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🍳 Easy Cook</h1>
        <p>사진 한 장으로 시작하는 손쉬운 요리</p>
    </div>

    <!-- 기본 양념 및 도구 선택 영역 -->
    <div class="card">
        <div class="card-title">🧂 보유 기본 양념</div>
        <div class="checkbox-group" id="condimentGroup"></div>

        <div class="card-title" style="margin-top: 15px;">🍳 보유 조리 도구</div>
        <div class="checkbox-group" id="applianceGroup"></div>
    </div>

    <!-- 파일 업로드 및 촬영 영역 -->
    <div class="card">
        <div class="card-title">📸 식재료 사진 업로드</div>
        <label for="imageInput" class="file-upload-btn">
            📷 사진 촬영 또는 앨범에서 선택하기
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <img id="imagePreview" class="preview-img" alt="선택한 이미지 미리보기">
    </div>

    <!-- 레시피 추천 버튼 -->
    <button class="btn-submit" onclick="analyzeRecipe()">🍳 Easy Cook 레시피 추천받기</button>

    <!-- 레시피 결과 출력 영역 -->
    <div class="card" style="margin-top: 20px;">
        <div class="card-title">📖 Easy Cook 추천 레시피</div>
        <div id="result">사진을 올리고 추천 버튼을 눌러주세요!</div>
    </div>
</div>

<script>
    // ⚠️ 서브 구글 계정으로 발급받은 Gemini API 키를 아래 큰따옴표 안에 넣으세요.
    const MY_GEMINI_API_KEY = "AQ.Ab8RN6JoHM6Sih4M0Z4if_hHV-VFLNdQ8jOx4qCVkRIcAbMBAA";

    let base64Image = "";

    window.onload = function() {
        const condimentGroup = document.getElementById('condimentGroup');
        DEFAULT_CONDIMENTS.forEach(item => {
            condimentGroup.innerHTML += `
                <label class="checkbox-label">
                    <input type="checkbox" class="condiment" value="${item.name}"> ${item.name}
                </label>`;
        });

        const applianceGroup = document.getElementById('applianceGroup');
        DEFAULT_APPLIANCES.forEach(item => {
            const checkedAttr = item.checked ? 'checked' : '';
            applianceGroup.innerHTML += `
                <label class="checkbox-label">
                    <input type="checkbox" class="appliance" value="${item.name}" ${checkedAttr}> ${item.name}
                </label>`;
        });
    };

    document.getElementById('imageInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const preview = document.getElementById('imagePreview');
                preview.src = event.target.result;
                preview.style.display = 'block';
                base64Image = event.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }
    });

    async function analyzeRecipe() {
        const resultDiv = document.getElementById('result');

        if (MY_GEMINI_API_KEY === "여기에_서브계정_Gemini_API_KEY_입력" || !MY_GEMINI_API_KEY) {
            alert('코드 안의 MY_GEMINI_API_KEY 변수에 API 키를 먼저 넣고 저장해 주세요.');
            return;
        }

        if (!base64Image) {
            alert('사진을 먼저 촬영하거나 선택해 주세요.');
            return;
        }

        const selectedCondiments = Array.from(document.querySelectorAll('.condiment:checked'))
            .map(cb => cb.value).join(', ');
        const selectedAppliances = Array.from(document.querySelectorAll('.appliance:checked'))
            .map(cb => cb.value).join(', ');

        resultDiv.innerHTML = '<div class="loading">🍳 Easy Cook AI가 레시피를 생성하는 중입니다...</div>';

        const promptText = generatePrompt(selectedCondiments, selectedAppliances);

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${MY_GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: promptText },
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ]
                    }]
                })
            });

            const data = await response.json();
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultDiv.innerText = data.candidates[0].content.parts[0].text;
            } else {
                resultDiv.innerText = '레시피를 가져오지 못했습니다. 사진 상태나 API 키를 다시 확인해 주세요.';
            }
        } catch (error) {
            resultDiv.innerText = '오류가 발생했습니다: ' + error.message;
        }
    }
</script>

</body>
</html>
